plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "mc${archive_minecraft_version}-Fabric-${mod_version}"
group = project.maven_group
def realVersion = project.mod_version + '+fabric'

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom supplies the repositories required by Minecraft, Fabric Loader and Fabric API.
}

sourceSets {
	main.resources.srcDirs += "$rootDir/src/generated/resources"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", realVersion

	filesMatching("fabric.mod.json") {
		expand "version": realVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
	options.compilerArgs.addAll(["-Xlint:all", "-Xlint:-processing"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
